<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Hospital Management System</title>
</head>
<body>
    <header>
        <div class="container">
            <img class="header-image" src="https://i0.wp.com/abroadeduco.com/wp-content/uploads/2021/12/srmt5.jpg?ssl=1">
            <h1>APS HOSPITAL</h1>
            <nav>
                <ul>
                    <li><a href="#patient-details">Home</a></li>
                    <li><a href="#service-selection">Services</a></li>
                    <li><a href="#receipt">Receipt</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="patient-details">
            <h2>Enter Patient Details</h2>
            <form id="patient-form">
                <input type="text" id="patient-name" placeholder="Patient Name" required>
                <input type="number" id="patient-age" placeholder="Age" required>
                <input type="tel" id="patient-phone" placeholder="Phone Number" required>
                <select id="patient-gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                <input type="text" id="patient-address" placeholder="Address" required>
                <button type="submit">Submit Details</button>
            </form>
        </section>

        <section id="service-selection" style="display:none;">
            <h2>What would you like to do?</h2>
            <button id="consult-doctor">Consult a Doctor</button>
            <button id="medical-test">Book a Medical Test</button>
        </section>

        <section id="doctor-selection" style="display:none;">
            <h2>Select a Department</h2>
            <div id="departments"></div>
        </section>

        <section id="doctor-details" style="display:none;">
            <h2>Available Doctors</h2>
            <div id="doctors"></div>
        </section>

        <section id="test-selection" style="display:none;">
            <h2>Select a Medical Test</h2>
            <div id="tests"></div>
        </section>

        <section id="receipt" style="display:none;">
            <h2>Appointment/Receipt</h2>
            <div id="receipt-output" class="receipt"></div>
            <button id="print-receipt">Print Receipt</button>
            <button id="new-appointment">Book Another Appointment/Test</button>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Hospital Management System. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
